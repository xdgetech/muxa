# muxa workspaces: copy to ~/.config/muxa/workspaces.toml on the host.
# The bridge reads it; the apps cannot change it (ADR 0015).
#
# A workspace is an Entity: one folder with its repos, accounts and agents
# (ADR 0031).
#
# name   shown in the app's New Task sheet; unique, at most 64 characters.
# root   the Entity's folder. It must exist. A leading ~/ is your home
#        directory. The git repos one or two levels below it are this
#        workspace's repos, e.g. <root>/api or <root>/clients/portal. Dot
#        folders such as .worktrees/, and tasks/, routines/ and assistant/,
#        are skipped.
#        Tasks without a repo get <root>/tasks/<slug>-<id>/. A client can
#        name a repo relative to root: api, clients/portal.
# repos  optional; more repos, usually outside root. They must exist. A
#        repo here or under root only starts Tasks in this workspace.
# park_after  optional; "30m", "12h" or "2d". The muxa daemon parks a Task
#        whose agent has been idle that long and that has no open Inbox
#        item: it writes .muxa/HANDOFF.md and closes the Task's session. The
#        Task, its TASK.md and its directory stay; Resume starts it again
#        (ADR 0034). Without it, nothing is parked.
#
# [workspace.agent]  optional; how this workspace's agents start (ADR 0016).
#   command  the agent command; else the bridge's --task-command (claude).
#   env      variables for the agent. A leading ~/ is your home directory.
#            CLAUDE_CONFIG_DIR and CODEX_HOME give the workspace its own
#            Claude Code or Codex login, claude.ai connectors, MCP servers
#            and settings. Run the agent once with that variable set to log in.
#            Values may be tokens: the bridge never logs them. TMUX and
#            TMUX_PANE are refused.
#
# [workspace.loop]  optional; lets a Task in this workspace have a Task Loop
#   (ADR 0019). The muxa daemon then runs a check command with /bin/sh -c
#   in the Task's directory after each of the agent's turns. Only a Task
#   in one of the workspace's repos, or a Task without a repo, can have a
#   loop.
#   Without this table, the workspace has no loops.
#   checks   a list of commands; a client must pick one of them exactly.
#            Or "any": any command a client sends, at most 4096 bytes.
#
# [workspace.routines]  optional; lets this workspace run Routines (ADR 0026,
#   0036). The Routines themselves are in <root>/.muxa/routines.toml (see
#   docs/examples/routines.toml). Agents can write under root, so this file
#   decides what they may do.
#   enabled        required; false or no table: no Routines here
#   direct_writes  a Routine may change external systems without a proposal
#                  only when this is true (default false)
#
# [workspace.assistant]  optional; lets the assistant work on this
#   workspace's Work items (ADR 0046). Without it, the workspace keeps
#   Captures and Work items but takes no requests. Each run gets its own
#   folder, <root>/assistant/<slug>-<id>/.
#   delegate          required; false: no requests here
#   worker            optional; a [[worker]] this workspace may use. Else the
#                     workspace's agent.
#   max_open_runs     runs open at once (default 1)
#   max_runs_per_day  runs started a day (default 10)
#   run_timeout       "30m", "12h" or "2d": a run with no result by then is
#                     timed-out; the agent is not stopped (default "30m")
#
# [assistant]  optional, at the top level; the host's switch for all
#   workspaces. Without it, or with enabled = false, no workspace takes
#   requests.
#   enabled           required
#   max_runs_per_day  runs started a day across all workspaces (default 20)
#
# Unknown keys are refused, so a typo fails loudly instead of being ignored.

# ~/work/company holds api/, web/ and clients/portal/: all three are its repos.
[[workspace]]
name = "Company"
root = "~/work/company"
# Remove the # sign to park Tasks idle for 12 hours.
# park_after = "12h"

[workspace.agent]
env = { CLAUDE_CONFIG_DIR = "~/.claude-company", CODEX_HOME = "~/.codex-company" }

[workspace.routines]
enabled = true

# Remove the # signs to allow these two checks in Company's Tasks.
# [workspace.loop]
# checks = ["make check", "cargo test --workspace"]

[[workspace]]
name = "Side project"
root = "~/projects/side"
# A repo that lives elsewhere.
repos = ["~/src/shared-ui"]

[[workspace]]
name = "Personal"
root = "~/personal"
