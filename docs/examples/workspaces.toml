# muxa workspaces: copy to ~/.config/muxa/workspaces.toml on the host.
# The bridge reads it. The apps can edit it through Settings (ADR 0074): the
# daemon keeps your comments and order, and keeps the old file as
# workspaces.toml.bak. `muxa-bridge daemon install --settings-read-only`
# turns that off.
#
# A workspace is an Entity: one folder with its repos, accounts and agents
# (ADR 0031).
#
# name   shown in the app's New Task sheet; unique, at most 64 characters.
# root   the Entity's folder. It must exist. A leading ~/ is your home
#        directory. The git repos one or two levels below it are this
#        workspace's repos, e.g. <root>/api or <root>/clients/portal. Dot
#        folders such as .worktrees/, and tasks/ and routines/, are
#        skipped.
#        Tasks without a repo get <root>/tasks/<slug>-<id>/. A client can
#        name a repo relative to root: api, clients/portal.
# repos  optional; more repos, usually outside root. They must exist. A
#        repo here or under root only starts Tasks in this workspace.
# park_after  optional; "30m", "12h" or "2d". The muxa daemon parks a Task
#        whose agent has been idle that long and that has no open Inbox
#        item: it writes .muxa/HANDOFF.md and closes the Task's session. The
#        Task, its TASK.md and its directory stay; Resume starts it again
#        (ADR 0034). Without it, nothing is parked.
#
# [workspace.agent]  optional; how this workspace's agents start (ADR 0016).
#   command  the agent command; else the bridge's --task-command (claude).
#   env      variables for the agent. A leading ~/ is your home directory.
#            CLAUDE_CONFIG_DIR and CODEX_HOME give the workspace its own
#            Claude Code or Codex login, claude.ai connectors, MCP servers
#            and settings. Run the agent once with that variable set to log in.
#            Values may be tokens: the bridge never logs them. Every agent of
#            the workspace gets them; a token that only some agents need is
#            better as a connection. TMUX and TMUX_PANE are refused.
#
# [[workspace.connection]]  optional; a secret an agent gets only when its
#   Task or Routine names it (ADR 0069). A Routine names its connections in
#   routines.toml (connections = ["linear"]); a Task, when it starts. Less
#   access for agents that read untrusted text; not a security boundary.
#   name     a-z, 0-9 and -, at most 64; unique in the workspace
#   env      the variable the agent gets, e.g. LINEAR_API_KEY
#   account  optional; who the secret acts as, shown to you
#   access   optional; "read" or "write". A label: the token itself decides
#            what an agent can do, so give a read-only token where the
#            service has one.
#   default  optional; true gives it to every Task and Routine here
#   The secret is in the macOS Keychain of the host, never in this file:
#     security add-generic-password -s muxa -a '<workspace>/<name>' -w
#   (it asks for the secret), or set it in the app's Settings. A missing or locked one stops the agent's
#   start with that reason.
#
# [[workspace.mcp]]  optional; an MCP server a Claude Code agent gets only
#   when its Task or Routine names it (ADR 0069). A Routine names its
#   servers in routines.toml (mcp = ["linear"]); a Task, when it starts.
#   muxa writes the chosen servers to .muxa/mcp.json in the agent's folder
#   and passes --strict-mcp-config, so servers from your own Claude Code
#   config (CLAUDE_CONFIG_DIR, ~/.claude.json, .mcp.json, plugins) no
#   longer load in muxa's agents. Codex gets no MCP servers yet.
#   name         a-z, 0-9 and -, at most 64; unique in the workspace
#   command      a server muxa's agent starts, with args = [...]; or
#   url          a remote server, with type = "http" (default) or "sse"
#   env          optional, command servers; plain variables, never secrets:
#                they are written to .muxa/mcp.json
#   headers      optional, url servers; plain values, where ${VAR} may name
#                the variable of one of this server's connections
#   connections  optional; the [[workspace.connection]]s whose variables the
#                server needs. The agent gets them; a command server's env
#                refers to them as ${VAR}, which Claude Code expands
#   default      optional; true gives it to every Task and Routine here
#
# [workspace.loop]  optional; lets a Task in this workspace have a Task Loop
#   (ADR 0019). The muxa daemon then runs a check command with /bin/sh -c
#   in the Task's directory after each of the agent's turns. Only a Task
#   in one of the workspace's repos, or a Task without a repo, can have a
#   loop.
#   Without this table, the workspace has no loops.
#   checks   a list of commands; a client must pick one of them exactly.
#            Or "any": any command a client sends, at most 4096 bytes.
#
# [workspace.routines]  optional; lets this workspace run Routines (ADR 0026,
#   0036). The Routines themselves are in <root>/.muxa/routines.toml (see
#   docs/examples/routines.toml). Agents can write under root, so this file
#   decides what they may do.
#   enabled        required; false or no table: no Routines here
#   direct_writes  a Routine may change external systems without a proposal
#                  only when this is true (default false)
#
# [[worker]]  optional; a named agent setup (ADR 0022).
#   description       what it does, at most 1 KiB, shown to you as its job
#
# [codex]  optional, at the top level (ADR 0028).
#   owned_threads  true lets a Codex worker or command run Routines: muxa
#                  creates the Codex thread and sends prompts to it by id
#                  (default false). Turn it on only after the developer
#                  checklist in docs/adr/0028 passes.
#
# Unknown keys are refused, so a typo fails loudly instead of being ignored.

# ~/work/company holds api/, web/ and clients/portal/: all three are its repos.
[[workspace]]
name = "Company"
root = "~/work/company"
# Remove the # sign to park Tasks idle for 12 hours.
# park_after = "12h"

[workspace.agent]
env = { CLAUDE_CONFIG_DIR = "~/.claude-company", CODEX_HOME = "~/.codex-company" }

[workspace.routines]
enabled = true

# A Linear token only the Tasks and Routines that name "linear" get.
# Its secret: security add-generic-password -s muxa -a 'Company/linear' -w
[[workspace.connection]]
name = "linear"
env = "LINEAR_API_KEY"
account = "me@company.example"
access = "read"

# Linear's MCP server, with the token of the "linear" connection. Only the
# Tasks and Routines that name "linear" get it.
[[workspace.mcp]]
name = "linear"
command = "npx"
args = ["-y", "linear-mcp-server"]
connections = ["linear"]

# Remove the # signs to allow these two checks in Company's Tasks.
# [workspace.loop]
# checks = ["make check", "cargo test --workspace"]

[[workspace]]
name = "Side project"
root = "~/projects/side"
# A repo that lives elsewhere.
repos = ["~/src/shared-ui"]

[[workspace]]
name = "Personal"
root = "~/personal"
