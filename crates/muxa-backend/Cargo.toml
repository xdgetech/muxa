[package]
name = "muxa-backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The contract suite every backend adapter must pass (ADR 0067).
contract = ["dep:tokio"]
# An in-memory backend for tests of the server.
fake = ["dep:tokio"]

[dependencies]
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time", "sync"], optional = true }
