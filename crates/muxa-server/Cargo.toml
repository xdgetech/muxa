[package]
name = "muxa-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The server on the user's running herdr-core; also needs MUXA_TEST_HERDR=1.
herdr-integration = []

[dependencies]
muxa-backend = { path = "../muxa-backend" }
muxa-inbox = { path = "../muxa-inbox" }
muxa-protocol = { path = "../muxa-protocol" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "sync", "rt", "macros", "time"] }
tracing = "0.1.44"

[dev-dependencies]
muxa-herdr = { path = "../muxa-herdr" }
muxa-backend = { path = "../muxa-backend", features = ["fake"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "net"] }
