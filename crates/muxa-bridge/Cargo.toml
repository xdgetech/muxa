[package]
name = "muxa-bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lexopt = "0.3.2"
muxa-protocol = { version = "0.1.0", path = "../muxa-protocol" }
muxa-tmux = { version = "0.1.0", path = "../muxa-tmux" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util", "io-std", "sync", "time", "process"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
base64 = "0.23.1"
rand = "0.10.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time"] }
vt100 = "0.18.1"

[features]
# Tests that start throwaway tmux servers (tmux -L muxa-test-*). Needs tmux >= 3.2.
tmux-integration = []
