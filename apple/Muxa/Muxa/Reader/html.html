<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The document runs in the frame below, which inherits this policy: its own inline
     scripts and styles run, nothing loads from the network (ADR 0065). -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; style-src 'self' 'unsafe-inline' data:; img-src data: blob:; font-src data:; media-src data: blob:">
<title>Reader</title>
<style>
  html, body { margin: 0; background: #fff; }
  /* Pinned to the viewport: on Android a percentage height resolved to 0. */
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
<script src="html.js"></script>
</head>
<body>
<!-- No allow-same-origin: the document gets an opaque origin, so it cannot reach
     this page, storage or cookies. No popups, forms or top navigation. -->
<iframe id="doc" sandbox="allow-scripts" title="Document"></iframe>
</body>
</html>
