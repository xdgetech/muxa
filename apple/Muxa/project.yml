# Generates Muxa.xcodeproj (not checked in): `make app-project`, or `xcodegen` in this directory.
name: Muxa
options:
  bundleIdPrefix: tech.xdge
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Muxa.xcconfig
  Release: Config/Muxa.xcconfig
packages:
  MuxaKit:
    path: ../MuxaKit
  # Markdown with code blocks for Inbox notes and agent replies (MIT).
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
  # The Mac app's terminal view (AppKit); MuxaKit uses the same package.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.99.1
targets:
  Muxa:
    type: application
    platform: iOS
    sources: [Muxa]
    dependencies:
      - package: MuxaKit
        products: [MuxaTransport, MuxaSession, MuxaUI, MuxaV2]
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUXA_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        # The store version, and the build number App Store Connect needs raised for each upload.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Muxa
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Muxa connects to your host over SSH.
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # The desktop app (ADR 0070): Home and Focus from Muxa/Next, with an AppKit terminal.
  MuxaMac:
    type: application
    platform: macOS
    sources:
      - path: Muxa/Next
        excludes: [TerminalPane.swift, Touch/**]
      - Muxa/Theme.swift
      - Muxa/Assets.xcassets
      - Muxa/Reader
      # The terminal's fonts (scripts/vendor-fonts.sh).
      - Muxa/Fonts
      - MuxaMac
    dependencies:
      - package: MuxaKit
        products: [MuxaTransport, MuxaSession, MuxaV2]
      - package: MarkdownUI
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUXA_BUNDLE_ID).mac
        PRODUCT_NAME: Muxa
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Muxa
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The device key lives in the data protection keychain, as on iOS.
        CODE_SIGN_ENTITLEMENTS: MuxaMac/MuxaMac.entitlements
  MuxaMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [MuxaMacUITests]
    dependencies:
      - target: MuxaMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUXA_BUNDLE_ID).mac.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MuxaMac
  MuxaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MuxaUITests]
    dependencies:
      - target: Muxa
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MUXA_BUNDLE_ID).uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Muxa:
    build:
      targets:
        Muxa: all
        MuxaUITests: [test]
    test:
      targets: [MuxaUITests]
  MuxaMac:
    build:
      targets:
        MuxaMac: all
        MuxaMacUITests: [test]
    test:
      targets: [MuxaMacUITests]
